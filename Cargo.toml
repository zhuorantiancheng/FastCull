[package]
name = "fastcull"
version = "2.7.4"
edition = "2024"
rust-version = "1.90"
description = "Fast RAW/JPEG culler with Lightroom and Adobe Bridge integration"
license = "MIT"
default-run = "fastcull"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
zune-jpeg = "0.5"
zune-core = "0.5"
fast_image_resize = "5"
quick-xml = "0.38"
tempfile = "3"
log = "0.4"
png = "0.18"
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
